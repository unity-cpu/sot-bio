<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --panel: rgba(16,13,22,0.92);
    --panel-border: rgba(255,255,255,0.10);
    --accent: #B084F5;
    --accent-2: #7C4DFF;
    --accent-dim: rgba(176,132,245,0.35);
    --text: #ffffff;
    --muted: #b8a9c9;
    --font: 'Poppins', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ============ BACKGROUND MEDIA LAYER ============ */
  /* Sits behind everything else. Fill in BACKGROUND config near the
     bottom of the script to use an image or video. */
  #bgMediaWrap{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--bg);
  }
  #bgMediaWrap img,
  #bgMediaWrap video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }
  /* dark overlay so text/panels stay readable on top of any media */
  #bgMediaWrap::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.55);
  }

  .vignette{
    position:fixed;inset:0;
    z-index:1;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,77,255,0.14), transparent 60%);
    pointer-events:none;
    animation: vignettePulse 3s ease-in-out infinite;
  }
  @keyframes vignettePulse{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  canvas#fx{
    position:fixed;inset:0;
    z-index:1;
    width:100%;height:100%;
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:24px;
    animation: rise .7s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .avatar-wrap{
    width:116px;height:116px;
    border-radius:50%;
    padding:3px;
    background: conic-gradient(from 180deg, #ffffff, #3C64FF, #ffffff, #2244CC, #ffffff);
    box-shadow: 0 0 30px rgba(60,100,255,0.45), 0 0 70px rgba(143,176,255,0.25);
    margin-bottom:20px;
    animation: pulseGlow 1.6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow: 0 0 30px rgba(60,100,255,0.45), 0 0 70px rgba(143,176,255,0.25); }
    50%{ box-shadow: 0 0 45px rgba(60,100,255,0.75), 0 0 100px rgba(143,176,255,0.45); }
  }
  .avatar{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#111;
  }

  h1{
    font-size:28px;
    font-weight:700;
    letter-spacing:0.005em;
    margin-bottom:20px;
    white-space:pre;
  }
  h1 span{ transition:none; }

  .discord-btn{
    display:flex;align-items:center;gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    font-weight:500;
    padding:9px 18px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:12px;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .discord-btn:hover{
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(124,77,255,0.35);
    transform:translateY(-1px) scale(1.03);
  }
  .discord-btn.copied{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 18px rgba(124,77,255,0.45);
  }
  .discord-btn svg{width:16px;height:16px;flex-shrink:0;}
  .discord-btn svg path{ fill:var(--accent); }

  .row{display:flex;gap:10px;margin-bottom:0;flex-wrap:wrap;justify-content:center;}
  .tab-btn{
    background: var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:var(--font);
    font-size:13.5px;
    font-weight:500;
    padding:9px 20px;
    border-radius:10px;
    cursor:pointer;
    transition: border-color .2s, box-shadow .2s, color .2s;
  }
  .tab-btn:hover{border-color:var(--accent-dim);}
  .tab-btn.active{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 18px rgba(124,77,255,0.4);
  }

  .panel{
    width:240px;
    margin-top:12px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    box-shadow: 0 12px 32px rgba(124,77,255,0.15);
    overflow:hidden;
    max-height:0;
    opacity:0;
    transform:translateY(-6px);
    transition: max-height .35s ease, opacity .3s ease, transform .3s ease, margin-top .35s ease;
  }
  .panel.open{
    max-height:360px;
    opacity:1;
    transform:translateY(0);
  }

  .panel-inner{padding:16px 14px;}
  .frens-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .frens-list li{
    font-size:13.5px;color:var(--muted);
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
    transition:color .2s;
  }
  .frens-list li:last-child{border-bottom:none;}
  .frens-list li:hover{color:var(--accent);}

  .about-text p{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:10px;
  }
  .about-text p:last-child{margin-bottom:0;}
  .about-text b{color:var(--accent);}

  /* invite list */
  .invite-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .invite-list a{
    display:flex;align-items:center;justify-content:space-between;
    text-decoration:none;
    font-size:13px;
    color:var(--text);
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 10px;
    transition: border-color .2s, color .2s, background .2s;
  }
  .invite-list a:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(124,77,255,0.1);
  }
  .invite-list a .arrow{opacity:0.5;transition:transform .2s;}
  .invite-list a:hover .arrow{transform:translateX(2px);opacity:1;}

  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;
    font-size:11px;
    color:#5c4a73;
    letter-spacing:0.02em;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .avatar-wrap{animation:none;}
    .vignette{animation:none;}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND MEDIA (image or video) ============ -->
<!-- Configure this in the BACKGROUND object near the bottom of the script -->
<div id="bgMediaWrap"></div>

<div class="vignette"></div>
<canvas id="fx"></canvas>

<!-- ============ MUSIC (plays silently in background, no visible icon/button) ============ -->
<audio id="bgm" loop preload="none">
  <source src="https://raw.githubusercontent.com/unity-cpu/sot-bio/main/rewrite your wrongs.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="avatar-wrap">
    <img class="avatar" src="https://media.discordapp.net/attachments/1480645053612425336/1532087534014697552/image.png?ex=6a6b9334&is=6a6a41b4&hm=12ab18b61be81619ac47355c1df8252be7bfcbb98a0e81a0cd6874709161df99&=&format=webp&quality=lossless" alt="avatar">
  </div>

  <h1 id="sweepTitle">Sot!</h1>

  <button class="discord-btn" id="discordBtn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.001-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028ZM8.02 15.33c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.42-2.157 2.42Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.42-2.157 2.42Z"/></svg>
    <span id="discordLabel">sot1231</span>
  </button>

  <div class="row">
    <button class="tab-btn" data-tab="frens">frens</button>
    <button class="tab-btn" data-tab="about">about me</button>
    <button class="tab-btn" data-tab="invites">servers</button>
  </div>

  <div class="panel" id="panel-frens">
    <div class="panel-inner">
      <ul class="frens-list">
        <li>unity</li>
        <li>crazy</li>
        <li>bunny</li>
        <li>ray</li>
        <li>frog</li>
        <li>why</li>
      </ul>
    </div>
  </div>

  <div class="panel" id="panel-about">
    <div class="panel-inner about-text">
      <p><b>im sot !</b></p>
      <p>hi I like playing vr and like playing siege.</p>
    </div>
  </div>

  <!-- ============ DISCORD INVITES ============ -->
  <!-- Edit the INVITES array in the script below to add/remove servers -->
  <div class="panel" id="panel-invites">
    <div class="panel-inner">
      <ul class="invite-list" id="inviteList"></ul>
    </div>
  </div>
</div>

<footer>made by unity</footer>

<script>
  // ============================================================
  // BACKGROUND MEDIA CONFIG
  // Set type to 'image' or 'video' and paste your link in url.
  // Leave type as 'none' to keep the plain black background.
  //   - image: any direct image link (.jpg/.png/.webp/.gif)
  //   - video: any direct video link (.mp4/.webm) — it will
  //            autoplay muted, loop, and cover the whole page
  // ============================================================
  const BACKGROUND = {
    type: 'video',   // 'image' | 'video' | 'none'
    url: 'https://github.com/unity-cpu/sot-bio/raw/refs/heads/main/0729.mp4'  // e.g. 'https://i.imgur.com/yourimage.jpg'
                    // or   'https://example.com/yourvideo.mp4'
  };

  (function setupBackground(){
    const wrap = document.getElementById('bgMediaWrap');
    if (BACKGROUND.type === 'image' && BACKGROUND.url) {
      const img = document.createElement('img');
      img.src = BACKGROUND.url;
      img.alt = '';
      wrap.appendChild(img);
    } else if (BACKGROUND.type === 'video' && BACKGROUND.url) {
      const vid = document.createElement('video');
      vid.src = BACKGROUND.url;
      vid.autoplay = true;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      wrap.appendChild(vid);
      vid.play().catch(() => {});
    }
  })();

  // ============ CONFIG: discord invites ============
  const INVITES = [
    { label: "techno tag", url: "https://discord.gg/technotag" },
    { label: "cgh", url: "https://discord.gg/npD2H4AFc2" },
  ];

  const inviteList = document.getElementById('inviteList');
  INVITES.forEach(inv => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = inv.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `<span>${inv.label}</span><span class="arrow">→</span>`;
    li.appendChild(a);
    inviteList.appendChild(li);
  });

  // discord copy-to-clipboard
  const discordBtn = document.getElementById('discordBtn');
  const discordLabel = document.getElementById('discordLabel');
  const discordTag = 'sot1231';
  discordBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(discordTag).catch(()=>{});
    discordLabel.textContent = 'Copied!';
    discordBtn.classList.add('copied');
    setTimeout(() => {
      discordLabel.textContent = discordTag;
      discordBtn.classList.remove('copied');
    }, 1500);
  });

  // tab toggle (accordion, only one open at a time)
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = {
    frens: document.getElementById('panel-frens'),
    about: document.getElementById('panel-about'),
    invites: document.getElementById('panel-invites')
  };
  let activeTab = null;

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.tab;
      if (activeTab === key) {
        panels[key].classList.remove('open');
        btn.classList.remove('active');
        activeTab = null;
        return;
      }
      tabs.forEach(b => b.classList.remove('active'));
      Object.values(panels).forEach(p => p.classList.remove('open'));
      btn.classList.add('active');
      panels[key].classList.add('open');
      activeTab = key;
    });
  });

  // ============ MUSIC (background, no visible control) ============
  // Browsers block autoplay WITH sound, no way around that. Standard
  // workaround: autoplay muted on load, unmute on first user interaction
  // anywhere on the page (click/tap/keypress).
  const bgm = document.getElementById('bgm');
  let unmutedYet = false;

  bgm.muted = true;
  bgm.play().catch(() => {});

  function unmuteOnFirstInteraction(){
    if (unmutedYet) return;
    unmutedYet = true;
    bgm.muted = false;
    if (bgm.paused) bgm.play().catch(() => {});
    window.removeEventListener('click', unmuteOnFirstInteraction);
    window.removeEventListener('keydown', unmuteOnFirstInteraction);
    window.removeEventListener('touchstart', unmuteOnFirstInteraction);
  }
  window.addEventListener('click', unmuteOnFirstInteraction);
  window.addEventListener('keydown', unmuteOnFirstInteraction);
  window.addEventListener('touchstart', unmuteOnFirstInteraction);

  // ============ SWEEP TEXT ANIMATOR ============
  // Ported from the Unity C# SweepTextAnimator: for each character, lerp
  // between colorA (purple) and colorB (white) based on a moving offset
  // so a "wave" of color sweeps across the text on a loop. No bounce/
  // rotate/scale — color + glow only, per the "don't want it bouncing" note.
  const sweepTitle = document.getElementById('sweepTitle');
  const sweepContent = sweepTitle.textContent;
  sweepTitle.innerHTML = '';
  const sweepSpans = [...sweepContent].map(ch => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.display = 'inline-block';
    sweepTitle.appendChild(span);
    return span;
  });

  const SWEEP_DURATION = 1.1;   // seconds
  const SWEEP_SPEED = 0.7;      // was 2.2 — slowed down
  const COLOR_A = [255, 60, 60];    // red
  const COLOR_B = [255, 165, 0];    // orange

  function lerp(a, b, t){ return a + (b - a) * t; }
  function repeat(t, length){ return t - Math.floor(t / length) * length; }

  let sweepStart = performance.now();
  function sweepTick(now){
    const timer = ((now - sweepStart) / 1000) * SWEEP_SPEED;
    const len = sweepSpans.length;
    sweepSpans.forEach((span, i) => {
      const offset = (timer / SWEEP_DURATION) - (i / len);
      const normalized = Math.abs(repeat(offset, 1.0) * 2.0 - 1.0);
      const r = Math.round(lerp(COLOR_A[0], COLOR_B[0], normalized));
      const g = Math.round(lerp(COLOR_A[1], COLOR_B[1], normalized));
      const b = Math.round(lerp(COLOR_A[2], COLOR_B[2], normalized));
      span.style.color = `rgb(${r},${g},${b})`;
      span.style.textShadow = `0 0 ${8 + normalized*10}px rgba(${r},${g},${b},0.9)`;
    });
    requestAnimationFrame(sweepTick);
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    sweepSpans.forEach((span, i) => {
      const t = i / Math.max(sweepSpans.length - 1, 1);
      const r = Math.round(lerp(COLOR_B[0], COLOR_A[0], t));
      const g = Math.round(lerp(COLOR_B[1], COLOR_A[1], t));
      const b = Math.round(lerp(COLOR_B[2], COLOR_A[2], t));
      span.style.color = `rgb(${r},${g},${b})`;
    });
  } else {
    requestAnimationFrame(sweepTick);
  }
</script>

</body>
</html>
